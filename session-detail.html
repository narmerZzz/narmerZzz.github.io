<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>セッションログ - シナリオタイトル１</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#008080;font-family:"MS PGothic","ＭＳ Ｐゴシック",Tahoma,sans-serif;color:#000;display:grid;place-items:center;padding:14px}.window{width:min(760px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000;padding:3px}.titlebar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:3px 3px 3px 7px;min-height:29px;font-weight:bold;font-size:15px}.close{font:bold 17px/19px Tahoma,sans-serif;width:24px;height:23px;color:#000;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;cursor:pointer;padding:0}.close:active,.winbutton:active{border-color:#404040 #fff #fff #404040}.menu{padding:6px 8px;font-size:13px}.content{margin:3px;background:#fff;border:2px solid;border-color:#777 #fff #fff #777;padding:16px 14px 20px;text-align:center}.content h1{font-size:clamp(21px,4vw,30px);margin:3px 0 16px}.content p{margin:7px 0;line-height:1.6}.result{font-weight:bold}.screenshot{display:block;max-width:100%;width:min(530px,100%);height:auto;margin:18px auto 12px;border:1px solid #555}.review{max-width:580px;margin:12px auto 0;line-height:1.8;overflow-wrap:anywhere}.review h2{font-size:18px;margin:14px 0 5px}.status{font-size:12px;padding:6px 9px;border:1px solid;border-color:#777 #fff #fff #777;margin:4px 3px 1px}.closed{text-align:center;background:#c0c0c0;padding:20px;border:2px solid;border-color:#fff #444 #444 #fff;max-width:90vw}.winbutton{padding:5px 15px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;cursor:pointer;font:inherit}.hidden{display:none}@media(max-width:500px){body{padding:6px}.content{padding:12px 8px}.menu{font-size:12px}}
.image-placeholder{width:100%;max-width:500px;min-height:250px;margin:20px auto;background:#fff;border:2px inset #808080;display:flex;align-items:center;justify-content:center;color:#666}.review p{white-space:pre-wrap}
/* 90's */
body {
  background-color: #02030d;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #fff 99%, transparent),
    radial-gradient(1px 1px at 90px 80px, #aaccff 99%, transparent),
    radial-gradient(2px 2px at 150px 120px, #fff 99%, transparent),
    radial-gradient(1px 1px at 230px 40px, #8899cc 99%, transparent),
    radial-gradient(1px 1px at 300px 170px, #fff 99%, transparent),
    radial-gradient(2px 2px at 370px 60px, #ccdfff 99%, transparent);

  background-size: 420px 230px;
  background-repeat: repeat;
}
</style>
<link rel="stylesheet" href="crt.css">
</head>
<body>
<section class="window" id="window" aria-label="セッションログのウィンドウ">
 <div class="titlebar"><span>▣ SESSION LOG</span><button class="close" type="button" id="close" aria-label="ウィンドウを閉じる">×</button></div>
 <div class="menu">File　 Edit　 View　 Help</div>
 <main class="content">
  <h1 id="scenario-title">読み込み中...</h1>
  <p><b>DATE：</b><span id="date"></span></p>
  <p><b>KP：</b><span id="kp"></span></p>
  <p><b>PL：</b><span id="pl"></span></p>
  <p class="result">RESULT：<span id="result"></span></p>
  <div id="image-placeholder" class="image-placeholder">[ 画像準備中 ]</div>
  <img class="screenshot hidden" id="screenshot" alt="セッションのスクリーンショット">
  <section class="review"><h2>【 感想 】</h2><p id="comment"></p></section>
  <p><a href="session-log.html">← 卓報告一覧へ</a></p>
 </main>
 <div class="status">SESSION LOG　｜　記録を表示中</div>
</section>
<div id="closed" class="closed hidden"><p>セッションログを閉じました。</p><button id="reopen" class="winbutton" type="button">ウィンドウを開く</button><p><a href="session-log.html">← セッションログ一覧へ</a></p></div>
<script>
const win=document.getElementById('window'),closed=document.getElementById('closed');
document.getElementById('close').addEventListener('click',()=>{win.classList.add('hidden');closed.classList.remove('hidden');document.getElementById('reopen').focus()});
document.getElementById('reopen').addEventListener('click',()=>{closed.classList.add('hidden');win.classList.remove('hidden');document.getElementById('close').focus()});

(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const title = document.getElementById('scenario-title');
  try {
    const response = await fetch('./sessions.json');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const sessions = await response.json();
    const session = sessions.find(item => item.id === id);
    if (!session) throw new Error('該当するセッションがありません');
    document.title = session.title + ' - セッションログ';
    title.textContent = session.title;
    document.getElementById('date').textContent = session.date.replaceAll('-', '/');
    document.getElementById('kp').textContent = session.kp;
    document.getElementById('pl').textContent = (session.pl || []).join('／');
    document.getElementById('result').textContent = session.result;
    document.getElementById('comment').textContent = session.comment || '';
    if (session.image) {
      const img = document.getElementById('screenshot');
      img.onload = () => {img.classList.remove('hidden'); document.getElementById('image-placeholder').classList.add('hidden')};
      img.src = session.image;
    }
  } catch (error) {
    title.textContent = '読み込めませんでした';
    document.getElementById('comment').textContent = error.message + '。GitHub Pages上で確認してください。';
  }
})();
</script>
</body>
</html>
